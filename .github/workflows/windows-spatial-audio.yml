name: Windows Spatial Audio (VS Clang + Windows SDK)

on:
  push:
    branches:
      - "feature/wasapi-spatial-audio"
  workflow_dispatch:

concurrency:
  group: windows-spatial-audio-x64
  cancel-in-progress: true

jobs:
  windows-sdk-x64:
    name: Windows SDK / Clang x64
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      CC: "clang"
      CXX: "clang++"
      CC_LD: "lld-link"
      CXX_LD: "lld-link"
      RUST_LD: "lld-link"
      WINDRES: "llvm-rc"

    steps:
      - name: Configure Git line endings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out source
        uses: actions/checkout@v7

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade meson
          winget install --exact --id NASM.NASM --accept-source-agreements --accept-package-agreements
          rustup default nightly

      - name: Update Meson wraps
        shell: pwsh
        run: |
          meson wrap update-db
          meson wrap install expat
          meson wrap install harfbuzz
          meson wrap install libpng
          meson wrap install zlib

      - name: Locate Visual Studio and Windows SDK
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetFolderPath([Environment+SpecialFolder]::ProgramFilesX86)
          $vswhere = Join-Path $programFilesX86 "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) {
            throw "Visual Studio C++ build tools were not found on this runner."
          }
          "VS=$vsPath" >> $env:GITHUB_ENV

          $sdkHeaders = Join-Path $programFilesX86 "Windows Kits\10\Include\*\um\spatialaudioclient.h"
          $headers = Get-ChildItem -Path $sdkHeaders -ErrorAction SilentlyContinue
          if (-not $headers) {
            throw "spatialaudioclient.h was not found in the installed Windows SDK."
          }
          Write-Host "Found Windows Spatial Audio SDK header: $($headers[0].FullName)"

      - name: Build complete mpv with Visual Studio Clang and Windows SDK
        id: build
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object {
            $_ -ne 'C:\Program Files\LLVM\bin' -and
            $_ -ne 'C:\Program Files\CMake\bin' -and
            $_ -ne 'C:\Strawberry\c\bin'
          }) -join ';'
          $env:PATH += ';C:\Program Files\NASM'

          Import-Module "$env:VS\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $env:VS -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64"

          clang --version
          lld-link --version
          meson --version

          try {
            ./ci/build-win32.ps1
          } catch {
            if (Test-Path "build/meson-logs/meson-log.txt") {
              Get-Content "build/meson-logs/meson-log.txt"
            }
            throw
          }

      - name: Verify Spatial Audio driver was enabled
        shell: pwsh
        run: |
          if (-not (Test-Path "build/config.h")) {
            throw "Meson did not generate build/config.h."
          }
          $enabled = Select-String -Path "build/config.h" -Pattern '^\s*#define HAVE_WASAPI_SPATIAL 1\s*$' -Quiet
          if (-not $enabled) {
            Write-Host "Relevant Meson feature configuration:"
            Select-String -Path "build/config.h" -Pattern 'WASAPI|WIN32_DESKTOP'
            throw "HAVE_WASAPI_SPATIAL is not enabled. The CI must not pass without compiling the new backend."
          }
          Write-Host "HAVE_WASAPI_SPATIAL=1"


      - name: Run Meson tests
        id: tests
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object {
            $_ -ne 'C:\Program Files\LLVM\bin' -and
            $_ -ne 'C:\Program Files\CMake\bin' -and
            $_ -ne 'C:\Strawberry\c\bin'
          }) -join ';'
          $env:PATH += ';C:\Program Files\NASM'

          Import-Module "$env:VS\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $env:VS -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64"

          try {
            meson test -C build -t 2
          } catch {
            if (Test-Path "build/meson-logs/testlog.txt") {
              Get-Content "build/meson-logs/testlog.txt"
            }
            throw
          }

      - name: Upload complete Windows SDK build
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: mpv-spatial-audio-windows-sdk-x64-${{ github.run_number }}
          path: |
            build/mpv.exe
            build/mpv.com
            build/mpv-*.bat
            build/vulkan-1.dll
          if-no-files-found: error
          retention-days: 14
